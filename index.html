<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala de Juegos · Gestión de Calidad</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ========== Variables y base ========== */
:root{
  --bg:#F4F7FC;
  --grid:#DCE5F3;
  --ink:#1B2A4E;
  --mut:#5A6786;
  --card:#FFFFFF;
  --line:#C5D1E6;
  --acc:#FFC933;
  --ok:#1FA66A;
  --bad:#E4572E;
  --shadow:0 6px 18px rgba(27,42,78,0.08);
  --shadow-hover:0 12px 28px rgba(27,42,78,0.14);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A33;--grid:#1A2747;--ink:#EAF0FF;--mut:#9AA9CC;--card:#17234A;--line:#2C3C69;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A33;--grid:#1A2747;--ink:#EAF0FF;--mut:#9AA9CC;--card:#17234A;--line:#2C3C69;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.5 Nunito,system-ui,sans-serif;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  transition:background 0.3s ease,color 0.3s ease;
}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
/* ========== Tipografía ========== */
h1,h2,.grande{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.1}
h1{font-size:2.2rem;font-weight:800}
.subtitulo{
  color:var(--mut);
  font-size:0.95rem;
  margin:4px 0 16px;
  text-align:center;
}

/* ========== Header ========== */
.logo{
  width:120px;
  height:120px;
  border-radius:16px;
  display:block;
  margin:0 auto 12px;
  box-shadow:var(--shadow);
  object-fit:cover;
}
header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin-bottom:24px;
  padding:16px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
}
.header-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.tema-toggle{
  background:var(--line);
  border:2px solid var(--line);
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:1.4rem;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:transform 0.2s ease,background 0.2s ease,border-color 0.2s ease;
}
.tema-toggle:hover{
  transform:rotate(15deg);
  background:var(--acc);
  border-color:var(--acc);
  color:#1B2A4E;
}
.total{
  background:var(--acc);
  color:#1B2A4E;
  font-weight:700;
  padding:6px 14px;
  border-radius:999px;
  white-space:nowrap;
  font-family:"Baloo 2",system-ui,sans-serif;
  font-size:1.1rem;
  box-shadow:var(--shadow);
}

/* ========== Botones generales ========== */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:active{transform:scale(0.97);transition:transform 0.1s ease}

/* ========== Menú principal ========== */
.menu{display:grid;gap:12px}
.juego-btn{
  display:flex;
  align-items:center;
  gap:16px;
  text-align:left;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  transition:transform 0.2s ease,box-shadow 0.2s ease,border-color 0.2s ease;
}
.juego-btn:hover{
  transform:translateY(-3px);
  border-color:var(--acc);
  box-shadow:var(--shadow-hover);
}
.juego-btn .ico{font-size:2.4rem}
.juego-btn b{
  font-family:"Baloo 2",sans-serif;
  font-size:1.35rem;
  display:block;
}
.juego-btn small{color:var(--mut);font-size:0.9rem}

/* ========== Paneles de juego ========== */
.panel{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}
.barra{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  gap:12px;
}
.barra h2{font-size:1.8rem}
.volver{
  background:none;
  border:2px solid var(--line);
  border-radius:10px;
  padding:6px 14px;
  font-size:0.95rem;
  transition:border-color 0.2s ease;
}
.volver:hover{border-color:var(--acc)}
.info{
  color:var(--mut);
  margin:0 0 12px;
  font-size:0.95rem;
}
.grande{
  font-size:2.8rem;
  font-weight:800;
  text-align:center;
  margin:12px 0;
}
.accion{
  background:var(--acc);
  color:#1B2A4E;
  border:0;
  border-radius:10px;
  padding:12px 22px;
  font-weight:700;
  margin:6px 4px;
  font-family:"Baloo 2",sans-serif;
  font-size:1.05rem;
  box-shadow:var(--shadow);
  transition:background 0.2s ease,transform 0.1s ease;
}
.accion:hover{background:#eabb2a}
.centro{text-align:center}

/* ========== Memoria ========== */
.tablero{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
}
.carta{
  aspect-ratio:1;
  font-size:2rem;
  background:var(--line);
  border:0;
  border-radius:12px;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform 0.2s ease,box-shadow 0.2s ease,border-color 0.2s ease;
}
.carta:hover:not(.up):not(.ok){background:var(--mut);opacity:0.9}
.carta.up{
  background:var(--card);
  border:2px solid var(--acc);
  box-shadow:var(--shadow-hover);
}
.carta.ok{border-color:var(--ok);box-shadow:0 0 0 3px rgba(31,166,106,0.2)}

/* ========== Cálculo ========== */
.opciones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.opciones button{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:12px;
  padding:16px;
  font-size:1.5rem;
  font-weight:700;
  box-shadow:var(--shadow);
  transition:transform 0.1s ease,box-shadow 0.2s ease,border-color 0.2s ease;
}
.opciones button:hover{border-color:var(--acc);transform:translateY(-2px)}
.opciones button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opciones button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ========== Atrapa ========== */
.arena{
  position:relative;
  height:300px;
  border:2px dashed var(--line);
  border-radius:12px;
  overflow:hidden;
  background:rgba(255,255,255,0.03);
}
.blanco{
  position:absolute;
  width:56px;
  height:56px;
  font-size:1.9rem;
  background:var(--acc);
  border:0;
  border-radius:50%;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform 0.15s ease;
}
.blanco:active{transform:scale(0.85)}

/* ========== Utilidades ========== */
.oculto{display:none}
.sombra-ok{box-shadow:0 0 0 4px rgba(31,166,106,0.3)}
.sombra-bad{box-shadow:0 0 0 4px rgba(228,87,46,0.3)}
</style>
</head>
<body>
<main>
  <header>
  <div class="header-top">
    <img src="niños.jpg" alt="Logo Sala de Juegos" class="logo">
    <button class="tema-toggle" id="tema-bt" title="Cambiar tema">🌓</button>
  </div>
  <h1>Sala de Juegos</h1>
  <p class="subtitulo">Gestión de Calidad · Entretenimiento educativo</p>
  <span class="total" id="total"></span>
</header>
  <div id="vista"></div>
</main>
<script>
// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const r = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a; // número al azar entre a y b
let limpiar = null;           // función para detener temporizadores del juego actual
let rec = {};                 // mejores puntajes por juego
try { rec = JSON.parse(localStorage.getItem("sala-records")) || {}; } catch (e) {}
const guardar = () => { try { localStorage.setItem("sala-records", JSON.stringify(rec)); } catch (e) {} };

// ---------- Tema claro/oscuro ----------
const temaBt = $("#tema-bt");
const savedTheme = localStorage.getItem("sala-tema");
if (savedTheme) {
  document.documentElement.setAttribute("data-theme", savedTheme);
  temaBt.textContent = savedTheme === "dark" ? "🌞" : "🌓";
} else if (window.matchMedia("(prefers-color-scheme:dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
  temaBt.textContent = "🌞";
}
temaBt.onclick = () => {
  const html = document.documentElement;
  const esOscuro = html.getAttribute("data-theme") === "dark";
  if (esOscuro) {
    html.removeAttribute("data-theme");
    localStorage.setItem("sala-tema", "light");
    temaBt.textContent = "🌓";
  } else {
    html.setAttribute("data-theme", "dark");
    localStorage.setItem("sala-tema", "dark");
    temaBt.textContent = "🌞";
  }
};

// ---------- Juegos ----------
// Para agregar un juego nuevo: suma un objeto aquí con su función iniciar(escena, fin)
const GAMES = [
  { id: "memoria", nombre: "Memoria", icono: "🧠", desc: "Encuentra las 8 parejas iguales", iniciar: memoria },
  { id: "calculo", nombre: "Cálculo mental", icono: "➕", desc: "10 operaciones matemáticas, elige el resultado correcto", iniciar: calculo },
  { id: "atrapa", nombre: "Atrapa el blanco", icono: "🎯", desc: "20 segundos para tocar el blanco", iniciar: atrapa },
  { id: "reaccion", nombre: "Reacción", icono: "⚡", desc: "Prueba tus reflejos y velocidad de reacción", iniciar: reaccion }
];

function memoria(el, fin) {
  const emo = ["🍎", "🚌", "📚", "🦙", "⚽", "🌵", "🎒", "☀️"];
  const cartas = [...emo, ...emo].sort(() => Math.random() - 0.5);
  let abiertas = [], intentos = 0, pares = 0, bloqueo = false;
  el.innerHTML = '<p class="info">Intentos: <b id="m-i">0</b></p><div class="tablero"></div>';
  const tab = el.querySelector(".tablero");
  cartas.forEach(e => {
    const b = document.createElement("button");
    b.className = "carta"; b.setAttribute("aria-label", "Carta oculta");
    b.onclick = () => {
      if (bloqueo || b.classList.contains("up")) return;
      b.textContent = e; b.classList.add("up"); abiertas.push(b);
      if (abiertas.length < 2) return;
      intentos++; $("#m-i").textContent = intentos;
      const [x, y] = abiertas; abiertas = [];
      if (x.textContent === y.textContent) {            // acierto
        x.classList.add("ok"); y.classList.add("ok"); pares++;
        if (pares === 8) fin(Math.max(10, 100 - (intentos - 8) * 5), "Terminaste en " + intentos + (intentos === 1 ? " intento." : " intentos."));
      } else {                                          // fallo: se voltean de nuevo
        bloqueo = true;
        setTimeout(() => { [x, y].forEach(c => { c.textContent = ""; c.classList.remove("up"); }); bloqueo = false; }, 700);
      }
    };
    tab.append(b);
  });
}

function calculo(el, fin) {
  let n = 0, pts = 0, resp;
  el.innerHTML = '<p class="info">Pregunta <b id="c-n"></b> de 10. Puntos: <b id="c-p">0</b></p><p class="grande" id="c-q"></p><div class="opciones" id="c-o"></div>';
  function nueva() {
    if (n === 10) return fin(pts, "Acertaste " + Math.round(pts / 10) + " de 10.");
    n++; $("#c-n").textContent = n;
    const a = r(2, 12), b = r(2, 12), op = ["+", "−", "×"][r(0, 2)];
    resp = op === "+" ? a + b : op === "−" ? a - b : a * b;
    $("#c-q").textContent = a + " " + op + " " + b + " = ?";
    const s = new Set([resp]);
    while (s.size < 4) s.add(resp + r(-10, 10));         // 3 opciones falsas distintas
    const box = $("#c-o"); box.innerHTML = "";
    [...s].sort(() => Math.random() - 0.5).forEach(v => {
      const bt = document.createElement("button"); bt.textContent = v;
      bt.onclick = () => {
        box.querySelectorAll("button").forEach(x => x.disabled = true);
        bt.classList.add(v === resp ? "ok" : "bad");
        if (v === resp) { pts += 10; $("#c-p").textContent = pts; }
        setTimeout(nueva, 600);
      };
      box.append(bt);
    });
  }
  nueva();
}

function atrapa(el, fin) {
  let t = 20, pts = 0;
  el.innerHTML = '<p class="info">Tiempo: <b id="a-t">20</b> s. Puntos: <b id="a-p">0</b></p><div class="arena"><button class="blanco" aria-label="Blanco">🎯</button></div>';
  const arena = el.querySelector(".arena"), bl = el.querySelector(".blanco");
  const mover = () => { bl.style.left = r(0, arena.clientWidth - 56) + "px"; bl.style.top = r(0, arena.clientHeight - 56) + "px"; };
  bl.onclick = () => { pts += 5; $("#a-p").textContent = pts; mover(); };
  mover();
  const timer = setInterval(() => {
    t--; $("#a-t").textContent = t;
    if (t <= 0) { clearInterval(timer); fin(pts, "Se acabó el tiempo."); }
  }, 1000);
  limpiar = () => clearInterval(timer);                 // se detiene si vuelves al menú
}

function reaccion(el, fin) {
  const NIVELES = {
    facil:  { nombre: "Fácil",  min: 2000, max: 5000 },
    medio:  { nombre: "Medio",  min: 1500, max: 4000 },
    dificil:{ nombre: "Difícil",min: 800,  max: 3000 }
  };
  const TOTAL = 10;
  let nivel = "medio", pts = 0, ronda = 0, mejor = 9999, t0 = 0, esperando = false;

  function mostrarInicio() {
    el.innerHTML =
      '<p class="info">Selecciona dificultad</p>' +
      '<div class="opciones" id="r-lv"></div>' +
      '<p class="info" id="r-rec">Récord: -- ms</p>';
    const box = $("r-lv");
    Object.entries(NIVELES).forEach(([id, n]) => {
      const b = document.createElement("button");
      b.textContent = n.nombre;
      b.onclick = () => { nivel = id; iniciarJuego(); };
      box.append(b);
    });
    const key = "reaccion-" + nivel;
    $("r-rec").textContent = "Récord " + NIVELES[nivel].nombre + ": " + (localStorage.getItem(key) || "--") + " ms";
  }

  function iniciarJuego() {
    pts = 0; ronda = 0; mejor = 9999;
    el.innerHTML =
      '<p class="info">Ronda <b id="r-n">0</b> de ' + TOTAL + '</p>' +
      '<p class="grande" id="r-msg">¡Espera la señal!</p>' +
      '<p class="info">Mejor: <b id="r-best">--</b> ms  Puntos: <b id="r-p">0</b></p>' +
      '<button class="accion" id="r-bt" style="display:none">¡Haz clic!</button>';
    const msg = $("r-msg"), bt = $("r-bt"), best = $("r-best"), ptn = $("r-p");
    function siguiente() {
      if (ronda === TOTAL) {
        fin(pts, "Juego terminado. Puntaje: " + pts);
        const key = "reaccion-" + nivel;
        const ant = localStorage.getItem(key);
        if (ant === null || mejor < Number(ant)) localStorage.setItem(key, mejor);
        return;
      }
      ronda++; $("r-n").textContent = ronda;
      msg.textContent = "¡Espera la señal!";
      bt.style.display = "none"; esperando = false;
      setTimeout(() => {
        msg.textContent = "¡YA!";
        t0 = performance.now();
        bt.style.display = "inline-block";
        esperando = true;
      }, r(NIVELES[nivel].min, NIVELES[nivel].max));
    }
    bt.onclick = () => {
      if (!esperando) return;
      const rt = Math.round(performance.now() - t0);
      if (rt < mejor) { mejor = rt; best.textContent = mejor + " ms"; }
      pts += Math.max(0, 600 - rt);
      ptn.textContent = pts;
      esperando = false; bt.style.display = "none";
      setTimeout(siguiente, 900);
    };
    siguiente();
  }
  mostrarInicio();
}

// ---------- Sistema (menú, puntajes, pantalla de resultado) ----------
function total() { $("#total").textContent = "⭐ " + Object.values(rec).reduce((a, b) => a + b, 0) + " pts"; }

function menu() {
  if (limpiar) { limpiar(); limpiar = null; }
  total();
  const v = $("#vista"); v.innerHTML = '<div class="menu"></div>';
  GAMES.forEach(g => {
    const b = document.createElement("button"); b.className = "juego-btn";
    b.innerHTML = '<span class="ico">' + g.icono + '</span><span><b>' + g.nombre + '</b><small>' + g.desc + ' (mejor: ' + (rec[g.id] || 0) + ')</small></span>';
    b.onclick = () => abrir(g);
    v.firstChild.append(b);
  });
}

function abrir(g) {
  if (limpiar) { limpiar(); limpiar = null; }
  const v = $("#vista");
  v.innerHTML = '<div class="panel"><div class="barra"><h2>' + g.nombre + '</h2><button class="volver">Menú</button></div><div id="escena"></div></div>';
  v.querySelector(".volver").onclick = menu;
  g.iniciar($("#escena"), (p, msg) => terminar(g, p, msg));
}

function terminar(g, p, msg) {
  if (p > (rec[g.id] || 0)) { rec[g.id] = p; guardar(); }
  total();
  const e = $("#escena");
  e.innerHTML = '<div class="centro"><p class="grande">' + p + ' puntos</p><p>' + msg + '</p><p class="info">Tu mejor puntaje: ' + rec[g.id] + '</p></div>';
  const again = document.createElement("button"); again.className = "accion"; again.textContent = "Jugar de nuevo"; again.onclick = () => abrir(g);
  const home = document.createElement("button"); home.className = "accion"; home.textContent = "Volver al menú"; home.onclick = menu;
  e.firstChild.append(again, home);
}

menu();
</script>
</body>
</html>
